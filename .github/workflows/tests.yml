name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', testbench: '^8.0' }   # Laravel 10
          - { php: '8.3', testbench: '^9.0' }   # Laravel 11
          - { php: '8.4', testbench: '^10.0' }  # Laravel 12
          - { php: '8.4', testbench: '^11.0' }  # Laravel 13
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction
      - run: composer test
